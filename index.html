function superseded_mergeWorkbook(base){
  if(base.workbookImports?.[WORKBOOK_IMPORT.id])return false;
  const clone=x=>JSON.parse(JSON.stringify(x));
  const equal=(a,b)=>JSON.stringify(a??null)===JSON.stringify(b??null);
  const ownIds=o=>[o.idP1,o.idP2,...(o.extra||[]).map((x,i)=>o['idP'+(i+3)]??x.id_expresso)].filter(Boolean).map(String);
  const previousCount=base.opps.length;
  base.opps=base.opps.filter(o=>o.workbookSource?.sheet!=='fretes improdutivos'&&!/^IMPRODUTIVO:[0-9]+$/.test(o.workbookKey||''));
  const report={added:0,updated:0,preserved:0,removed:previousCount-base.opps.length,at:now(),source:WORKBOOK_IMPORT.file};
  const claimed=new Set();
  for(const item of WORKBOOK_IMPORT.records){
    let target=base.opps.find(o=>o.workbookKey===item.key);
    const old=LEGACY.find(o=>o.id===item.legacyId);
    if(!target&&old)target=base.opps.find(o=>o.legacyId===old.id&&!claimed.has(o.id));
    if(!target){
      const ids=item.source.legs.map(x=>x.id).sort().join('+');
      const found=base.opps.filter(o=>!claimed.has(o.id)&&ownIds(o).sort().join('+')===ids&&o.date===item.data.date&&o.transp===item.data.transp&&cents(o.orig_cost)===cents(item.data.orig_cost)&&cents(o.cons_cost)===cents(item.data.cons_cost));
      if(found.length===1)target=found[0];
    }
    if(target?.workbookKey===item.key){
      const previous=target.workbookSource;
      const unchanged=previous?.financialCells&&equal(previous.financialCells,item.source.financialCells)&&equal(previous.legs.map(x=>x.cost),item.source.legs.map(x=>x.cost));
      if(unchanged){
        target.workbookSource=clone(item.source);
        if(['p1','p2','orig_cost','cons_cost','econ','financialMode'].some(k=>!equal(target[k],item.data[k])))report.preserved++;
      }else applySheetFinancials(target,item,report.at);
      report.updated++;claimed.add(target.id);continue;
    }
    if(!target){
      target={...clone(item.data),id:nextId('OP',base.opps),client:mapClient(item.data.dest),history:[]};
      base.opps.push(target);report.added++;
    }else{
      report.updated++;
      const kept=[];
      if(old){
        const baseline=migrate(old,0), incoming=item.data;
        const links=[target.req1,target.req2,target.executionId,...(target.extra||[]).map(x=>x.req)].some(Boolean);
        const sourceIds=item.source.legs.map(x=>x.id);
        const idsCompatible=[target.idP1,target.idP2,...(target.extra||[]).map((x,i)=>target['idP'+(i+3)]??x.id_expresso)].every((id,i)=>!id||String(id)===sourceIds[i]);
        const untouched=['origs','p1','p2','orig_cost'].every(k=>equal(target[k],baseline[k]))&&!(target.extra||[]).length;
        if(untouched&&idsCompatible&&!links){
          for(const k of ['origs','p1','p2','orig_cost','extra','idP1','idP2'])target[k]=clone(incoming[k]);
        }else{
          // A locally changed leg, ID or linked operation must retain its user-assigned identity.
          for(const k of ['idP1','idP2'])if(!target[k]&&equal(target.origs?.[Number(k.slice(3))-1],incoming.origs?.[Number(k.slice(3))-1]))target[k]=incoming[k];
          kept.push('fretes originais e vínculos alterados no painel');
        }
        for(const k of ['cons_cost','transp','date','dest','status']){
          if(equal(target[k],baseline[k]))target[k]=clone(incoming[k]);
          else if(!equal(target[k],incoming[k]))kept.push(k==='cons_cost'?'frete consolidado':k==='status'?'status':k);
        }
        if(!target.modal)target.modal='EXPRESSO';
      }
      if(kept.length){target.workbookPreserved=kept;report.preserved++;}
    }
    target.workbookKey=item.key;
    applySheetFinancials(target,item,report.at);
    target.history??=[];
    target.history.push({at:report.at,event:'IDs e valores conferidos com a planilha',user:'Importação da planilha',old:'',value:item.source.sheet+' · linhas '+item.source.firstRow+'–'+item.source.lastRow+' · IDs '+item.source.legs.map(x=>x.id).join(' + ')});
    claimed.add(target.id);
  }
  base.workbookImports??={};base.workbookImports[WORKBOOK_IMPORT.id]=report;
  return true;
}

function financialBucket(o){return o.status==='Consolidada'?'consolidated':'not-consolidated';}

 return {count:rows.length,original:total(o=>o.orig_cost),consolidated:total(o=>o.cons_cost),savings:total(o=>{const e=economy(o);return e.ready?e.value:null;})};

function worksheetFinancialSummary(){

 const rows=WORKBOOK_IMPORT.records.map(item=>({...item.data,workbookKey:item.key,workbookSource:item.source}));
 const pending=rows.filter(o=>o.workbookSource.sheet==='NÃO CONSOLIDADO');
 const scope=WORKBOOK_IMPORT.summaryScope;
 const consolidated=rows.filter(o=>o.workbookSource.sheet==='CONSOLIDADO'&&o.date>=scope.from&&o.date<=scope.to&&scope.carriers.includes(o.transp));
 return {pending,consolidated,pendingTotals:financialTotals(pending),consolidatedTotals:financialTotals(consolidated)};
}

function analyticsContext(){
 const reference=mode==='base'&&analyticsMode==='reference';
 const selectedRows=selected(),source=reference?worksheetFinancialSummary():null;

 const pending=groups.notConsolidated,consolidated=groups.consolidated,rows=reference?[...pending,...consolidated]:selectedRows.opps;
 const p=financialTotals(pending),c=financialTotals(consolidated),comparable=consolidated.filter(o=>economy(o).ready);
 const before=comparable.reduce((n,o)=>n+cents(economy(o).original),0)/100;
 const after=comparable.reduce((n,o)=>n+cents(economy(o).consolidated),0)/100;
 const saving=comparable.reduce((n,o)=>n+cents(economy(o).value),0)/100;
 const delta=(cents(before)-cents(after))/100,reduction=before>0?delta/before*100:null;
 const ids=new Set(rows.flatMap(o=>freightIdEntries(o).map(x=>x.id)).filter(Boolean));
 const legCount=rows.reduce((n,o)=>n+freightIdEntries(o).length,0),missingIds=rows.flatMap(freightIdEntries).filter(x=>!x.id).length;
 return {reference,pending,consolidated,rows,p,c,comparable,before,after,saving,delta,reduction,ids,legCount,missingIds,
   period:reference?analyticsReferencePeriod():financialPeriodLabel(),
   scope:reference?'Referência do Excel':'Registros filtrados',reqs:reference?[]:selectedRows.reqs,
   mismatch:Math.abs(cents(saving)-cents(delta))>1,positive:comparable.filter(o=>economy(o).value>0).length};

function analyticsPercent(value){return value==null?'—':value.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';}

function analyticsRoute(o){const from=(o.origins||[]).filter(Boolean);return (from.length?from:(o.origs||[])).join(' + ')+' → '+(o.dest||o.client||'Destino não informado');}
function analyticsRank(rows,kind,metric='original'){
 const groups=new Map();
 const add=(label,value)=>{if(cents(value)===null)return;label=String(label||'Não informado');const item=groups.get(label)||{label,value:0,count:0};item.value+=cents(value);item.count++;groups.set(label,item);};
 for(const o of rows){
  if(kind==='supplier'){
   const values=o.legCount===1?[o.p1]:[o.p1,o.p2,...(o.extra||[]).map(x=>x.cost)];
   values.forEach((value,i)=>add(o.origs?.[i]||o.extra?.[i-2]?.supplier,value));
  }else add(kind==='carrier'?o.transp:analyticsRoute(o),metric==='consolidated'?o.cons_cost:metric==='saving'?(economy(o).ready?economy(o).value:null):o.orig_cost);
 }
 const items=[...groups.values()].map(x=>({...x,value:x.value/100})).sort((a,b)=>b.value-a.value||a.label.localeCompare(b.label,'pt-BR'));
 const total=items.reduce((n,x)=>n+x.value,0);return items.map(x=>({...x,share:total>0?x.value/total*100:null}));

ão salvos neste navegador. Para transferir a operação entre computadores, use o backup. Para uso multiusuário, é necessário integrar banco de dados e autenticação.</div></div></section><section class="panel"><div class="panel-head"><h2>Clientes cadastrados</h2></div><div class="panel-body"><div class="settings-list">${(db.clients||CLIENTS).map(c=>`<div>${icon('check')} ${esc(c)}</div>`).join('')}</div><form id="client-form" class="inline-form" style="margin-top:20px"><input name="client" required placeholder="Adicionar outro cliente" aria-label="Novo cliente"><button class="btn primary">Adicionar</button></form></div></section><section class="panel"><div class="panel-head"><h2>Referência operacional</h2></div><div class="panel-body"><h3>IT.OPE.04 · Frete Expresso · Rev.02</h3><p class="subtitle">Solicitação → Cotações → Aprovação → NOX/PFR → Validação → Pedido → Resumo.</p><p class="subtitle">Transit time: deslocamento até coleta + transporte até entrega, arredondado para cima.</p><p class="subtitle">A consolidação depende da confirmação de rota, capacidade e prazo. As sugestões são uma triagem para análise humana.</p>${btn('Consultar orientações','help','','ghost')}</div></section></div>`}
function timeline(r){return `<div class="timeline">${(r.history||[]).slice().reverse().map(x=>`<div class="timeline-item"><b>${esc(x.event)}</b><small>${x.at?dt(x.at):'Data da importação não registrada'} · ${esc(x.user||'Operador')}</small>${x.old||x.value?`<div class="audit-value">${x.old?`Anterior: ${esc(x.old)}<br>`:''}${x.value?'Novo: '+esc(x.value):''}</div>`:''}</div>`).join('')||'<p class="muted">Sem eventos registrados.</p>'}</div>`}
function stepper(r){const current=stage(r);return `<div class="stepper">${STEPS.map((s,i)=>`<div class="step ${i<current?'done':i===current?'current':''}"><span>${i<current?'✓':i+1}</span>${s}</div>`).join('')}</div>`}
function finance(o){return `${freightIdsSummary(o)}<div class="finance"><div><span>Frete Original P1</span><b class="num">${money(o.p1)}</b><small>Valor preservado na origem</small></div>${o.legCount===1?'':`<div><span>Frete Original P2</span><b class="num">${money(o.p2)}</b><small>Valor preservado na origem</small></div>`}<div><span>${o.legCount===1?'Custo final':'Frete Consolidado'}</span><b class="num">${money(o.cons_cost)}</b><small>Total da operação proposta</small></div></div>${o.extra?.length?`<div class="notice">${o.extra.map((x,i)=>`<b>P${i+3}</b> · ${esc(x.supplier)} · ${money(x.cost)}${x.req?` · <button class="link" data-action="open-req" data-id="${esc(x.req)}">${esc(x.req)}</button>`:''}`).join('<br>')}</div>`:''}<div class="footnote" style="margin:0 0 18px">Total original registrado: <b>${money(o.orig_cost)}</b>${o.extra?.length?' · inclui '+o.extra.length+' frete(s) adicional(is)':''}</div>${savingsCard(o)}`}
function opBody(o){if(drawer.tab==='Histórico')return timeline(o);let a=getR(o.req1),b=getR(o.req2);return `<section class="section"><h3>Comparativo de frete</h3>${o.consolidationMode==='manual'?'<div class="notice">Consolidação registrada com fretes informados manualmente. Acompanhe a execução e a aprovação no portal ILC.</div>':''}${finance(o)}${o.legacy&&!o.workbookSource?`<div class="notice">Registro histórico <b>${esc(o.legacyId)}</b>. O arquivo original informa o custo total, sem divisão confiável entre P1 e P2. Os valores individuais não foram estimados.</div>`:''}${o.cons_cost===0&&o.status!=='Cancelada'?'<div class="notice amber">O valor consolidado é zero na base original. Confirme este dado antes de utilizá-lo em decisões.</div>':''}${!o.workbookSource&&o.sourceRecord&&Math.abs((o.orig_cost-o.cons_cost)-(o.sourceRecord.econ||0))>.02?'<div class="notice amber">A economia gravada na base diverge da diferença entre os custos. Os valores de origem foram preservados para conferência.</div>':''}</section><div class="grid2 section">${(o.legCount===1?[a]:[a,b]).map((r,i)=>`<section class="panel"><div class="panel-head"><h2>Solicitação P${i+1}</h2>${r?`<button class="link" data-action="open-req" data-id="${r.id}">${r.id}</button>`:'<span class="pill">Histórico / manual</span>'}</div><div class="panel-body">${details([['ID Frete Expresso P'+(i+1),legExpressId(o,i+1)],['Nº do pedido',legOrder(o,i+1)],['Fornecedor',r?.supplier||o.origs[i]],['Origem',r?.origin||o.origins?.[i]],['Cliente',r?.client||o.client],['Janela',r?date(r.startDate)+' '+r.startTime+' até '+date(r.endDate)+' '+r.endTime:null],['Entrega necessária',r?date(r.deliveryDate)+' '+r.deliveryTime:null],['Veículo',r?.vehicle||o.vehicle],['Peso',r?.weight?number(r.weight)+' kg':null],['Volume',r?.volume?number(r.volume)+' m³':null],['Fluxo',r?.flow||o.flow],['Modal',r?.modal||o.modal]])}</div></section>`).join('')}</div><section class="panel section"><div class="panel-head"><h2>Rota consolidada</h2>${badge(o.status)}</div><div class="panel-body"><div class="grid2"><div>${o.origs.map((x,i)=>`<div class="route-line"><span class="route-dot">${i+1}</span><div><p>${esc(x)}</p><small>${esc(o.origins?.[i]||'Origem registrada')}</small></div></div>`).join('')}<div class="route-line"><span class="route-dot">JD</span><div><p><b>${esc(o.dest)}</b></p><small>Destino</small></div></div></div>${details([['Transportadora',o.transp],['Veículo',o.vehicle],['Transit time',o.tt?o.tt+' h':null],['Modal',o.modal],['Responsável',o.resp],['ID 1 (P1)',legExpressId(o,1)],['ID 2 (P2)',legExpressId(o,2)],['Nº pedido consolidado',externalOrder(o)]])}</div>${o.notes?`<p class="subtitle">${esc(o.notes)}</p>`:''}${o.executionId?`<div class="notice" style="margin-top:15px;margin-bottom:0">Atendimento consolidado: <button class="link" data-action="open-req" data-id="${o.executionId}">${o.executionId}</button>. A aprovação e a PFR seguem no fluxo deste atendimento.</div>`:''}</div></section>${workbookSourcePanel(o)}<section class="section"><h3>Histórico da oportunidade</h3>${timeline(o)}</section>`}
function reqOverview(r){const quote=(r.quotes||[]).find(x=>x.id===r.selectedQuote);const opportunity=getO(r.opportunity);return `${orderSection(r)}${r.consolidatedInto?`<div class="notice">Solicitação vinculada ao atendimento <button class="link" data-action="open-req" data-id="${r.consolidatedInto}">${r.consolidatedInto}</button>. Os dados originais foram preservados.</div>`:''}${risk(r)?`<div class="notice amber">${icon('clock')} ${risk(r)}. Confirme o prazo e a necessidade do cliente antes de seguir.</div>`:''}${opportunity?finance(opportunity)+(quote?`<div class="notice">Frete da cotação aprovada: <b>${money(quote.value)}</b> · ${esc(quote.carrier)}. Revisões do cenário não alteram esta aprovação.</div>`:''):`<div class="finance" style="grid-template-columns:1fr 1fr"><div><span>${quote?'Frete aprovado':'Frete cotado / estimado'}</span><b>${money(currentCost(r))}</b></div><div><span>Transit time</span><b>${quote?quote.tt+' h':r.quotes?.[0]?.tt?r.quotes[0].tt+' h':'A cotar'}</b></div></div>`}<section class="panel section"><div class="panel-head"><h2>Identificação e transporte</h2>${badge(r.status)}</div><div class="panel-body">${details([['Cliente / planta',r.client],['Fornecedor',r.supplier],['Solicitante',r.requester],['Transportadora',carrier(r)],['Origem',r.origin],['Destino',r.dest],['Veículo',r.vehicle],['Modal',r.modal],['Fluxo',r.flow],['Tipo de material',r.material],['Janela de coleta',date(r.startDate)+' '+r.startTime+' → '+date(r.endDate)+' '+r.endTime],['Necessidade de entrega',date(r.deliveryDate)+' '+r.deliveryTime]])}</div></section><section class="panel section"><div class="panel-head"><h2>Tempos do processo</h2></div><div class="panel-body">${details([['Solicitação → primeira cotação',timeDiff(r.createdAt,r.quotes?.[0]?.at)],['Cotação → aprovação',timeDiff(r.quotes?.[0]?.at,r.approvedAt)],['Aprovação → pedido',timeDiff(r.approvedAt,r.orderAt)],['Tempo total até encerramento',timeDiff(r.createdAt,r.finishedAt)]])}</div></section><section class="section"><h3>Justificativa</h3><p style="font-size:12px">${esc(r.justification||'Não informada')}</p>${r.cancelReason?`<div class="notice red" style="margin-top:15px">Cancelamento: ${esc(r.cancelReason)}</div>`:''}</section>`}
function reqBody(r){const tab=drawer.tab;if(tab==='Histórico')return timeline(r);if(tab==='Visão Geral')return reqOverview(r);if(tab==='Solicitação')return `<section class="panel section"><div class="panel-head"><h2>Dados da solicitação</h2>${stage(r)<=2&&active(r)?btn('Editar dados','edit-req',`data-id="${r.id}"`,'small'):''}</div><div class="panel-body">${details([['ID',r.id],['Nº do pedido (portal ILC)',r.orderNumber],['Criada em',dt(r.createdAt)],['Cliente',r.client],['Fornecedor',r.supplier],['Solicitante',r.requester],['Origem',r.origin],['Destino',r.dest],['Região / agrupamento',r.region],['Data início janela',date(r.startDate)+' '+r.startTime],['Data fim janela',date(r.endDate)+' '+r.endTime],['Necessidade entrega',date(r.deliveryDate)+' '+r.deliveryTime],['Veículo',r.vehicle],['Modal',r.modal],['Fluxo',r.flow],['Peso',number(r.weight)+' kg'],['Volume',number(r.volume)+' m³'],['Altura',r.height?number(r.height)+' m':null],['Comprimento',r.length?number(r.length)+' m':null],['Largura',r.width?number(r.width)+' m':null],['Material',r.material],['NOX/PFR',r.pfr],['Justificativa',r.justification],['Observações',r.notes]])}</div></section>`;if(tab==='Cotações'){const s=sla(r);return `<div class="notice ${s.tone==='red'?'red':s.tone==='amber'?'amber':''}"><b data-sla="${r.id}">${s.label}</b>${r.quoteStarted?' · '+s.mins+' min desde o início':''}<div class="actions" style="margin-top:10px">${stage(r)<=2&&active(r)?btn(r.quoteStarted?'Registrar contato adicional':'Iniciar cotação',r.quoteStarted?'contact':'start-quote',`data-id="${r.id}"`,'small'):''}${stage(r)<=2&&active(r)?btn(icon('plus')+' Adicionar cotação','new-quote',`data-id="${r.id}"`,'small'):''}</div></div>${(r.quotes||[]).map(x=>`<section class="panel section"><div class="panel-head"><h2>${esc(x.carrier)}</h2>${badge(r.selectedQuote===x.id?'Aprovada':r.selectedQuote?'Não selecionada':'Recebida')}</div><div class="panel-body">${details([['Frete',money(x.value)],['Transit time',x.tt+' h'],['Até a coleta',x.collectHours==null?null:x.collectHours+' h'],['Transporte até entrega',x.transportHours==null?null:x.transportHours+' h'],['Recebida em',dt(x.at)],['Registrada por',x.user]])}${x.attachment?`<div class="actions" style="margin-top:13px">${btn(icon('file')+' '+esc(x.attachment.name),'attachment',`data-attachment="${x.attachment.id}" data-name="${esc(x.attachment.name)}"`,'small')}${btn('Baixar PDF','attachment-download',`data-attachment="${x.attachment.id}" data-name="${esc(x.attachment.name)}"`,'small')}</div><p class="subtitle">Anexado em ${dt(x.attachment.at)} · ${esc(x.attachment.user)}</p>`:`<p class="subtitle">Sem anexo. Inclua o PDF para validar a solicitação.</p>${active(r)?btn('Anexar PDF a esta cotação','quote-attach',`data-id="${r.id}" data-quote="${x.id}"`,'small'):''}`}</div></section>`).join('')||'<div class="empty">Nenhuma proposta recebida. Adicione a primeira cotação.</div>'}${['Em Cotação','Aguardando Cotação'].includes(r.status)&&(r.quotes||[]).length?btn('Enviar para aprovação','submit-approval',`data-id="${r.id}"`,'primary'):''}`}
if(tab==='Aprovação')return `<div class="notice">A decisão deve refletir a aprovação do cliente. Identifique o aprovador e a proposta escolhida.</div>${r.status==='Aguardando Aprovação'?`<form id="approval-form" data-id="${r.id}"><div class="form-grid">${sel('Cotação vencedora *','quote',(r.quotes||[]).map(x=>x.id+' | '+x.carrier+' | '+money(x.value)+' | '+x.tt+' h'))}${field('Aprovador do cliente *','approver','','text','required')}${area('Justificativa da decisão *','reason','',true)}</div><div class="actions" style="margin-top:18px"><button class="btn primary">Registrar aprovação</button>${btn('Retornar à cotação','return-quote',`data-id="${r.id}"`)}</div><div id="drawer-error" class="error-text"></div></form>`:details([['Status',r.status],['Aprovador',r.approver],['Data aprovação',dt(r.approvedAt)],['Cotação selecionada',r.selectedQuote],['Justificativa',r.approvalReason]])}`;
if(tab==='NOX / PFR')return `<section class="panel"><div class="panel-head"><h2>Formalização NOX / PFR</h2></div><div class="panel-body">${['Aguardando PFR','Em Validação'].includes(r.status)&&!r.pfrAttachment?`<form id="pfr-form" data-id="${r.id}"><div class="form-grid">${field('Número NOX/PFR *','pfr',r.pfr,'text','required')}${df('Data aprovação NOX *','pfrDate',r.pfrDate||today(),true)}${field('Aprovador *','approver',r.approver,'text','required')}${sel('Charge Back *','chargeback',['Sim','Não'],r.chargeback||'Não')}${field('Anexo da aprovação (PDF) *','attachment','','file','accept="application/pdf,.pdf" required')}</div><div class="actions" style="margin-top:18px"><button class="btn primary">Salvar NOX/PFR</button></div><div id="drawer-error" class="error-text"></div></form>`:details([['NOX/PFR',r.pfr],['Aprovador',r.approver],['Data de aprovação NOX',date(r.pfrDate)],['Charge Back',r.chargeback]])}${r.pfrAttachment?btn('Visualizar aprovação','attachment',`data-attachment="${r.pfrAttachment.id}" data-name="${esc(r.pfrAttachment.name)}"`):''}</div></section>`;
if(tab==='Validação')return `<section class="panel"><div class="panel-head"><h2>Checklist operacional</h2></div><div class="panel-body"><div class="notice">Confira a cotação vencedora, documentos, janela e autorização antes de gerar o pedido.</div><form id="validation-form" data-id="${r.id}"><div class="checks">${CHECKS.map(c=>`<label class="check"><input type="checkbox" name="checks" value="${c}" ${r.validatedAt?'checked disabled':''} ${r.status==='Em Validação'?'required':'disabled'}>${c}</label>`).join('')}</div>${r.status==='Em Validação'?'<button class="btn primary" style="margin-top:20px">Validar informações</button>':''}<div id="drawer-error" class="error-text"></div></form>${r.validatedAt?`<p class="subtitle">Validado em ${dt(r.validatedAt)}.</p>`:''}</div></section>`;
if(tab==='Pedido')return `${orderSection(r)}${getO(r.opportunity)?freightIdsSummary(getO(r.opportunity)):''}<div class="notice">Registros locais para acompanhamento. A geração aqui não envia dados ao portal ILC ou à transportadora.</div><section class="panel section"><div class="panel-head"><h2>Pedido e coleta</h2></div><div class="panel-body">${details([['Solicitação',r.id],['Transportadora vencedora',carrier(r)],['Valor aprovado',money(currentCost(r))],['Cliente',r.client],['Origem',r.origin],['Destino',r.dest],['Nº do pedido (portal ILC)',r.orderNumber],['Referência do pedido local',r.order],['Pedido gerado em',dt(r.orderAt)],['Número da coleta',r.collection],['Coleta gerada em',dt(r.collectionAt)],['Comunicação',r.transmission||((db.integrated||[]).includes(carrier(r))?'Integração prevista · sem transmissão':'Comunicação manual necessária')],['Responsável',r.communication?.user]])}<div class="actions" style="margin-top:20px">${r.status==='Validado'?btn('Gerar pedido local','order',`data-id="${r.id}"`,'primary'):''}${r.status==='Pedido Gerado'?btn('Gerar coleta local','collection',`data-id="${r.id}"`,'primary'):''}${r.status==='Coleta Gerada'?btn('Registrar comunicação / transmissão','communication',`data-id="${r.id}"`)+btn('Finalizar atendimento','finish',`data-id="${r.id}"`,'green'):''}</div>${r.communication?`<p class="subtitle">${esc(r.communication.note)} · ${dt(r.communication.at)}</p>`:''}</div></section>`;return ''}
function previous_draw(){if(!drawer)return '';const o=drawer.type==='op'?getO(drawer.id):getR(drawer.id);if(!o){drawer=null;return ''}const isOp=drawer.type==='op';const tabs=isOp?['Visão Geral','Histórico']:['Visão Geral','Solicitação','Cotações','Aprovação','NOX / PFR','Validação','Pedido','Histórico'];return `<div class="drawer-backdrop" data-action="close-drawer"></div><section class="drawer" role="dialog" aria-modal="true" aria-label="Detalhes ${esc(isOp?opLabel(o):o.id)}"><div class="drawer-header"><div class="drawer-title"><div><div class="eyebrow">${isOp?'OPORTUNIDADE DE CONSOLIDAÇÃO':'SOLICITAÇÃO DE FRETE EXPRESSO'}</div><h2>${esc(isOp?opLabel(o):o.id)} ${badge(o.status)}</h2><p>${esc(o.client||'Cliente não informado')} · ${date(o.date)} ${mode==='demo'?'· Demonstração':''}</p></div><button class="icon-btn" data-action="close-drawer" aria-label="Fechar painel">${icon('close')}</button></div>${!isOp?stepper(o):''}<div class="tabs">${tabs.map(t=>`<button class="${drawer.tab===t?'active':''}" data-action="drawer-tab" data-tab="${t}">${t}</button>`).join('')}</div></div><div class="drawer-content">${isOp?opBody(o):reqBody(o)}</div><div class="drawer-foot"><div class="actions">${btn(icon('download')+' PDF / Imprimir','print')}${!isOp&&active(o)?btn('Cancelar solicitação','cancel',`data-id="${o.id}"`,'danger'):''}</div><div class="actions">${isOp?btn('Editar cenário','edit-op',`data-id="${o.id}"`):btn('Nº do pedido','edit-order',`data-id="${o.id}"`)}${isOp&&['Identificada','Em análise','Não consolidada'].includes(o.status)?btn('Descartar','discard',`data-id="${o.id}"`,'danger')+btn('Consolidar','consolidate',`data-id="${o.id}"`,'primary'):''}${isOp&&o.status==='Consolidada'&&!o.executionId?btn('Registrar reversão','reverse',`data-id="${o.id}"`,'danger'):''}${btn('Fechar','close-drawer')}</div></div></section>`}
function previous_render(){const scroll=window.scrollY;document.body.className=(compact?'compact ':'')+(drawer?'drawer-open':'');document.getElementById('root').innerHTML=header()+({exec:executive,opps:oppPage,requests:requestsPage,quotes:quotesPage,approvals:requestsPage,orders:requestsPage,history:historyPage,settings:settingsPage,'menu-empty':menuEmptyPage}[view]||oppPage)()+`<footer class="footer"><span>ILC – Integrator Logistics Company · Sistema de Gestão de Fretes Expressos</span><span>Versão 4.1 · ${mode==='demo'?'Demonstração':'Base do painel'}</span></footer></div></main>`+draw()+renderModal();window.scrollTo(0,scroll);document.body.style.overflow=drawer||modal?'hidden':''}

function toast(msg,err=false){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast'+(err?' err':'');el.setAttribute('role','status');el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),5500)}
function clientField(value=''){return `<label class="field"><span>Cliente / planta *</span><input name="client" list="client-list" value="${esc(value)}" required placeholder="Pesquisar cliente ou selecionar Outro"><datalist id="client-list">${(db.clients||CLIENTS).concat(['Outro']).map(x=>`<option value="${esc(x)}">`).join('')}</datalist><small>Pesquise na lista ou digite um novo cliente.</small></label><label class="field" id="other-client" style="display:none"><span>Nome do cliente *</span><input name="otherClient" placeholder="Digite o cliente"></label>`}
function requestForm(r={}){let todayD=today();return `<form id="request-form" data-id="${r.id||''}"><section class="form-section"><h3><span>01</span>Identificação</h3><div class="form-grid">${clientField(r.client)}${field('Fornecedor *','supplier',r.supplier,'text','required list="suppliers-list"')}${field('Nº do pedido (portal ILC)','orderNumber',r.orderNumber,'text','maxlength="80" placeholder="Ex.: 388091"','Número do pedido do sistema de origem; separado do ID e do NOX/PFR.')}${field('Solicitante *','requester',r.requester||db.user,'text','required')}${field('Origem (cidade / UF) *','origin',r.origin,'text','required')}${field('Destino *','dest',r.dest,'text','required list="dest-list"')}${field('Região para consolidação','region',r.region,'text','','Use o mesmo agrupamento para origens próximas.')}<datalist id="suppliers-list">${SUPPLIERS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="dest-list">${DESTINATIONS.concat(CLIENTS).map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div></section><section class="form-section"><h3><span>02</span>Janela de coleta e necessidade de entrega</h3><div class="form-grid">${df('Data início *','startDate',r.startDate||todayD,true)}${field('Hora início *','startTime',r.startTime||'08:00','time','required')}${df('Data fim *','endDate',r.endDate||todayD,true)}${field('Hora fim *','endTime',r.endTime||'18:00','time','required')}${df('Data necessidade entrega *','deliveryDate',r.deliveryDate||todayD,true)}${field('Hora necessidade entrega *','deliveryTime',r.deliveryTime||'23:59','time','required')}</div></section><section class="form-section"><h3><span>03</span>Transporte e dimensões da carga</h3><div class="form-grid">${sel('Tipo de veículo *','vehicle',VEHICLES.map(x=>x.nome),r.vehicle)}${sel('Modal / Tipo de transporte *','modal',MODALS,r.modal||'EXPRESSO')}${sel('Fluxo *','flow',['Fábrica','Fornecedor'],r.flow||'Fábrica')}${field('Peso (kg) *','weight',r.weight,'number','required min="0.01" step="0.01"')}${field('Volumetria (m³)','volume',r.volume,'number','min="0" step="0.001"')}${field('Altura (m)','height',r.height,'number','min="0" step="0.01"')}${field('Comprimento (m)','length',r.length,'number','min="0" step="0.01"')}${field('Largura (m)','width',r.width,'number','min="0" step="0.01"')}</div></section><section class="form-section"><h3><span>04</span>Informações complementares</h3><div class="form-grid">${sel('Tipo de material *','material',['Produtivo','Improdutivo','Embalagem'],r.material||'Produtivo')}${field('Código NOX/PFR','pfr',r.pfr)}${field('Frete original estimado (R$)','originalCost',r.originalCost,'number','min="0" step="0.01"')}${area('Justificativa *','justification',r.justification,true)}${area('Observações','notes',r.notes)}</div></section><div id="duplicate-warning"></div><div id="form-error" class="error-text"></div><div class="actions"><button class="btn primary" type="submit">Salvar solicitação</button>${btn('Voltar','close-modal')}</div></form>`}

function extraLeg(i,x={},locked=false){return `<div class="panel extra-row" data-leg="${i}" style="margin-top:12px"><div class="panel-head"><h2>Solicitação P${i}</h2>${!locked?btn('Remover','remove-leg','','small'):''}</div><div class="panel-body form-grid">${legIdField({['idP'+i]:x.id_expresso},i)}${locked?field('Solicitação vinculada','extraReq'+i,x.req,'text','readonly'):sel('Vincular solicitação','extraReq'+i,db.requests.filter(notExecuted).map(r=>r.id),x.req,'Cadastro manual')}${field('Nº do pedido P'+i+' (portal ILC)','orderP'+i,x.orderNumber,'text','maxlength="80"')}${field('Fornecedor P'+i+' *','extraSupplier'+i,x.supplier,'text',`required ${locked?'readonly':''}`)}${field('Origem P'+i+' *','extraOrigin'+i,x.origin,'text',`required ${locked?'readonly':''}`)}${field('Frete Original P'+i+' (R$) *','extraCost'+i,x.cost,'number',`required min="0.01" step="0.01" ${locked?'readonly':''}`)}</div></div>`}

function previous_opForm(o={}){if(o.id)return scenarioForm(o);const requests=db.requests.filter(notExecuted);return `<form id="op-form" data-id="${o.id||''}"><div class="notice">Informe P1 e P2 para comparar e salvar a consolidação. Vincular solicitações é opcional; quando todos os fretes estão vinculados, a consolidação gera um atendimento para aprovação.</div><section class="form-section"><h3><span>01</span>Identificação da oportunidade</h3><div class="form-grid">${clientField(o.client)}${df('Data *','date',o.date||today(),true)}${field('Destino *','dest',o.dest,'text','required')}${field('Responsável *','resp',o.resp||db.user,'text','required')}</div></section><section class="form-section"><h3><span>02</span>Fretes originais</h3><div class="form-grid">${[1,2].map(i=>`<div class="panel"><div class="panel-head"><h2>Solicitação P${i}</h2></div><div class="panel-body" style="display:grid;gap:12px">${legIdField(o,i,true)}${o.id?field('Solicitação vinculada','req'+i,o['req'+i],'text','readonly'):sel('Vincular solicitação','req'+i,requests.map(r=>r.id),o['req'+i],'Cadastro manual')}${field('Nº do pedido P'+i+' (portal ILC)','orderP'+i,o['orderP'+i],'text','maxlength="80"')}${field('Fornecedor P'+i+' *','supplier'+i,o.origs?.[i-1],'text',`required list="op-suppliers" ${o.id?'readonly':''}`)}${field('Origem P'+i+' (cidade / UF) *','origin'+i,o.origins?.[i-1],'text',`required ${o.id?'readonly':''}`)}${field('Frete Original P'+i+' (R$) *','p'+i,o['p'+i],'number',`required min="0.01" step="0.01" ${o.id?'readonly':''}`)}</div></div>`).join('')}</div><div id="extra-legs">${(o.extra||[]).map((x,i)=>extraLeg(i+3,x,!!o.id)).join('')}</div>${!o.id?btn(icon('plus')+' Adicionar outro frete','add-leg','','small'):''}<datalist id="op-suppliers">${SUPPLIERS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>${o.id?'<p class="subtitle">Os valores originais são preservados; apenas o cenário consolidado pode ser atualizado.</p>':''}</section><section class="form-section"><h3><span>03</span>Cenário consolidado</h3><div data-live-ids>${freightIdsSummary(o)}</div><div class="form-grid">${field(o.legCount===1?'Custo final (R$) *':'Frete Consolidado (R$) *','cons_cost',o.cons_cost,'number','required min="0" step="0.01"')}${sel('Transportadora *','transp',CARRIERS,o.transp)}${sel('Veículo *','vehicle',VEHICLES.map(x=>x.nome),o.vehicle)}${sel('Modal / Tipo de transporte *','modal',MODALS,o.modal||'EXPRESSO')}${sel('Fluxo *','flow',['Fábrica','Fornecedor'],o.flow||'Fábrica')}${field('Transit time total (h) *','tt',o.tt,'number','required min="1" step="1"')}${area('Observações da rota','notes',o.notes)}</div></section><div data-live-economy>${savingsCard(o)}</div><div id="form-error" class="error-text"></div><div class="actions"><button class="btn primary">Salvar oportunidade</button>${btn('Voltar','close-modal')}</div></form>`}
function quoteForm(id){const r=getR(id);return `<form id="quote-form"><div class="form-grid">${sel('Solicitação *','requestId',db.requests.filter(x=>notExecuted(x)&&stage(x)<=2).map(x=>x.id),id)}${sel('Transportadora *','carrier',CARRIERS)}${field('Valor do frete (R$) *','value','','number','required min="0.01" step="0.01"')}${field('Tempo até a coleta (h) *','collectHours','','number','required min="0" step="0.01"')}${field('Transporte até entrega (h) *','transportHours','','number','required min="0.01" step="0.01"')}${field('Cotação em PDF *','attachment','','file','required accept="application/pdf,.pdf"')}<label class="field full"><span>Transit time total</span><div id="tt-preview" class="notice">Informe os tempos. O total será arredondado para a próxima hora inteira.</div></label>${area('Resumo da cotação','notes')}</div><div class="notice amber">Para ARMANI, confira as restrições de fornecedor do procedimento. Elegibilidade e exceções devem ser confirmadas com a operação.</div><div id="form-error" class="error-text"></div><div class="actions"><button class="btn primary">Adicionar cotação</button>${btn('Voltar','close-modal')}</div></form>`}
function confirmBox(title,body,action){confirmCallback=action;modal={kind:'confirm',title,body};render();document.querySelector('.modal .btn.primary')?.focus()}
function showModal(kind,data={}){lastFocus=document.activeElement;modal={kind,...data};render();document.querySelector('.modal input, .modal button')?.focus()}
function previous_renderModal(){if(!modal)return '';if(modal.kind==='kpi')return renderKpiModal(modal.key);let m=modal,title='',sub='',body='',narrow=false;if(m.kind==='menu-preferences'){title='Personalizar menu';narrow=true;body=menuPreferencesForm();}else if(m.kind==='request'){title=m.id?'Editar solicitação':'Nova solicitação de frete expresso';sub='Campos com * são obrigatórios. Datas em DD/MM/AAAA.';body=requestForm(getR(m.id)||{})}else if(m.kind==='op'){title=m.id?'Editar cenário consolidado':'Nova oportunidade de consolidação';sub='Compare o atendimento individual com uma única operação.';body=opForm(getO(m.id)||m.prefill||{})}else if(m.kind==='order-number'){title='Número do pedido do frete expresso';narrow=true;const r=getR(m.id);body=`<form id="order-number-form" data-id="${esc(r.id)}"><div class="notice">${esc(r.id)} · ${esc(r.client)}<br>Registre o número emitido no portal ILC. Ele permanece separado do NOX/PFR e da referência local.</div>${field('Nº do pedido (portal ILC)','orderNumber',r.orderNumber,'text','maxlength="80" placeholder="Ex.: 388091"')}<div id="form-error" class="error-text"></div><div class="actions" style="margin-top:16px"><button type="submit" class="btn primary">Salvar pedido</button>${btn('Voltar','close-modal')}</div></form>`;}else if(m.kind==='quote'){title='Adicionar cotação';sub='Registre preço, prazo e PDF da transportadora.';body=quoteForm(m.id)}else if(m.kind==='confirm'){title=m.title;narrow=true;body=`${m.body}<div class="actions" style="margin-top:20px;justify-content:flex-end">${btn('Voltar','close-modal')}${btn('Confirmar','confirm-yes','','primary')}</div>`}else if(m.kind==='reason'){title=m.title;narrow=true;body=`<form id="reason-form" data-kind="${m.reasonKind}" data-id="${m.id}"><div class="form-grid">${sel('Motivo *','reason',['Tipo de veículo incorreto','Necessidade de alteração do tipo de veículo','Fluxo incorreto','Fornecedor divergente','Cliente divergente','Alteração de Transit Time','Alteração de valor','Alteração de transportadora','Validação não concluída','Solicitação cancelada pelo cliente','Cenário não viável','Outro'])}${area('Justificativa detalhada *','detail','',true)}</div><div id="form-error" class="error-text"></div><div class="actions" style="margin-top:18px"><button class="btn danger">Registrar decisão</button>${btn('Voltar','close-modal')}</div></form>`}else if(m.kind==='export'){title='Exportar visualização';narrow=true;body=`<p class="subtitle">${lastRows.length} registros do recorte atual. CSV e Excel incluem as colunas disponíveis; datas no padrão brasileiro.</p><div class="settings-list" style="margin-top:20px">${btn(icon('download')+' Excel (.xlsx)','export-xlsx')}${btn(icon('download')+' CSV (.csv)','export-csv')}${btn(icon('file')+' PDF / Imprimir','print')}${btn('Backup completo (.json)','backup')}</div><p class="subtitle">Para PDF, escolha “Salvar como PDF” na janela de impressão. O backup inclui o ambiente inteiro.</p>`}else if(m.kind==='candidates'){title='Possíveis consolidações';sub='Triagem por cliente, destino, região, janela, veículo e entrega. Confirme capacidade e transit time.';body=`<div class="settings-list">${candidates().map(([a,b])=>`<div class="setting-row"><div><h3>${a.id} + ${b.id}</h3><p>${esc(a.client)} · ${esc(a.origin)} / ${esc(b.origin)}</p><p>${date(a.startDate)} · ${a.vehicle} · ${number(a.weight+b.weight)} kg</p></div>${btn('Analisar','candidate',`data-a="${a.id}" data-b="${b.id}"`,'primary')}</div>`).join('')||'<div class="empty">Nenhuma combinação adicional encontrada.</div>'}</div>`}else if(m.kind==='communication'){title='Registrar comunicação';narrow=true;body=`<form id="communication-form" data-id="${m.id}"><div class="notice">Registre somente uma comunicação já realizada ou uma transmissão confirmada no sistema externo.</div><div class="form-grid">${sel('Tipo de registro *','type',['E-mail enviado e contato telefônico realizado','Transmissão confirmada no portal'])}${field('Referência / protocolo *','reference','','text','required')}${area('Evidência / observações *','note','',true)}</div><div class="actions" style="margin-top:18px"><button class="btn primary">Registrar</button></div><div id="form-error" class="error-text"></div></form>`}else if(m.kind==='help'){title='Como usar o painel';body=`<div class="settings-list"><div class="notice">Esta é uma aplicação local para apresentação e acompanhamento. Os registros ficam no navegador; o fluxo não efetua envios ao portal ILC ou às transportadoras.</div><h3>1. Oportunidades e valores originais</h3><p>Abra qualquer ID para comparar P1, P2, rota e cenário consolidado. A base histórica mantém todos os fornecedores e totais originais, inclusive divergências, para conferência.</p><h3>2. Solicitação até coleta</h3><p>Crie a solicitação, inicie a cotação e anexe as propostas em PDF. Envie para aprovação, registre o aprovador, formalize NOX/PFR com o PDF e valide o checklist. Então gere os registros locais de pedido e coleta.</p><h3>3. Consolidação</h3><p>Use solicitações ainda não realizadas. A triagem automática verifica cliente, destino, janela, região, veículo e entrega. Confirme capacidade, sequência de rota, disponibilidade e prazo com a operação. A consolidação cria um atendimento único e preserva as solicitações originais.</p><h3>4. Prazos e elegibilidade</h3><p>A referência do procedimento é 30 minutos para retorno e 10 minutos adicionais após contato. O transit time soma deslocamento até coleta e transporte até entrega, sempre arredondado para cima. Conforme o documento fornecido, ARMANI tem restrições para Aperam, Arcelormittal, Gerdau, Paulisteel, Usiminas e Steel. Se o material estiver em posse de TW, JSL ou Mirassol, a cotação também pode ser realizada com esses transportadores. Para VF, confirme disponibilidade e valor no BID; sem rota cadastrada, registre BID não encontrado e faça a cotação. Confirme a elegibilidade na matriz operacional vigente.</p><h3>5. Segurança dos dados</h3><p>Exporte backups JSON com frequência e antes de trocar de computador. O nome do responsável é autodeclarado. O uso corporativo multiusuário exige autenticação, permissões, banco central, trilha de auditoria protegida e integração real.</p><h3>6. Demonstração</h3><p>Selecione Demonstração para explorar os dados fictícios. Este ambiente tem seu próprio armazenamento. Retorne à Base do painel para visualizar os 79 registros originais e seus cadastros.</p></div>`}else if(m.kind==='alerts'){title='Atenção operacional';body=alertContent(selected().reqs)}return `<div class="modal-backdrop"><section class="modal ${narrow?'narrow':''}" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-head"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="icon-btn" data-action="close-modal" aria-label="Fechar janela">${icon('close')}</button></div><div class="modal-body">${body}</div></section></div>`}
function formObject(f){return Object.fromEntries(new FormData(f).entries())}
function formError(msg){const el=document.getElementById(modal?'form-error':'drawer-error');if(el){el.textContent=msg;el.scrollIntoView({block:'nearest'})}else toast(msg,true)}
function validateDates(f,keys){for(const k of keys){const d=iso(f[k]);if(!d)throw Error('Informe uma data válida em DD/MM/AAAA.');f[k]=d}}
function requireFields(f,keys){for(const k of keys)if(!String(f[k]??'').trim())throw Error('Preencha todos os campos obrigatórios.');}
function getStore(){return new Promise((resolve,reject)=>{let req=indexedDB.open('ilc_expressos_attachments_v3',1);req.onupgradeneeded=()=>req.result.createObjectStore('files',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(Error('Armazenamento de PDFs indisponível.'))})}
async function idbPut(item){const d=await getStore();return new Promise((resolve,reject)=>{let tx=d.transaction('files','readwrite');tx.objectStore('files').put(item);tx.oncomplete=()=>{d.close();resolve()};tx.onerror=()=>{d.close();reject(Error('Não foi possível salvar o PDF.'))}})}
async function idbGet(id){const d=await getStore();return new Promise((resolve,reject)=>{let r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>{d.close();resolve(r.result)};r.onerror=()=>{d.close();reject(Error('Erro ao abrir anexo.'))}})}
async function attach(file){if(!file?.size)throw Error('Anexe o PDF solicitado.');if(file.size>10*1024*1024)throw Error('O limite de cada PDF é 10 MB.');let header=await file.slice(0,5).text();if(header!=='%PDF-')throw Error('O arquivo deve ser um PDF válido.');let meta={id:mode+'-'+crypto.randomUUID(),name:file.name,at:now(),user:db.user};await idbPut({...meta,blob:new Blob([file],{type:"application/pdf"})});return meta}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),15000)}
async function attachmentOpen(id,name,dl){const item=await idbGet(id);if(!item?.blob)throw Error('Anexo não encontrado neste navegador. Restaure um backup que contenha o PDF.');if(dl)download(item.blob,name);else{let u=URL.createObjectURL(item.blob);let w=window.open(u,'_blank');if(!w)download(item.blob,name);setTimeout(()=>URL.revokeObjectURL(u),60000)}}
function snapshot(x){return JSON.stringify(x)}
async function previous_handleSubmit(e){e.preventDefault();let form=e.target;if(form.dataset.busy)return;form.dataset.busy='true';const submitButton=form.querySelector('button[type=submit],button:not([type])');if(submitButton)submitButton.disabled=true;let f=formObject(form),id=form.dataset.id;try{
if(form.id==='filters-form'){if(f.from){f.from=iso(f.from);if(!f.from)throw Error('Data início inválida.')}if(f.to){f.to=iso(f.to);if(!f.to)throw Error('Data fim inválida.')}if(f.from&&f.to&&f.from>f.to)throw Error('Data início deve ser anterior ao fim.');filters=Object.fromEntries(Object.entries(f).filter(x=>x[1]));page=1;render()}
else if(form.id==='request-form'){if(f.client==='Outro')f.client=f.otherClient;delete f.otherClient;requireFields(f,['client','supplier','requester','origin','dest','vehicle','modal','flow','material','justification']);validateDates(f,['startDate','endDate','deliveryDate']);if(!Number.isFinite(when(f.startDate,f.startTime))||!Number.isFinite(when(f.endDate,f.endTime))||!Number.isFinite(when(f.deliveryDate,f.deliveryTime)))throw Error('Informe os horários da janela e da entrega.');if(when(f.endDate,f.endTime)<when(f.startDate,f.startTime))throw Error('O fim da janela deve ocorrer após o início.');if(when(f.deliveryDate,f.deliveryTime)<when(f.endDate,f.endTime))throw Error('A necessidade de entrega deve ocorrer após o fim da janela.');for(let k of ['weight','volume','height','width','length'])f[k]=Number(f[k]||0);f.originalCost=f.originalCost===''?null:Number(f.originalCost);const cap=VEHICLES.find(x=>x.nome===f.vehicle);if(cap&&(f.weight>cap.kg||f.volume>cap.m3))throw Error('Peso ou volume excede a capacidade de referência do veículo. Confirme o perfil da carga.');const duplicates=db.requests.filter(r=>r.id!==id&&active(r)&&norm(r.supplier)===norm(f.supplier)&&norm(r.client)===norm(f.client)&&r.vehicle===f.vehicle&&norm(r.dest)===norm(f.dest)&&Math.max(when(r.startDate,r.startTime),when(f.startDate,f.startTime))<=Math.min(when(r.endDate,r.endTime),when(f.endDate,f.endTime)));if(duplicates.length&&!form.querySelector('[name=duplicateAck]:checked')){document.getElementById('duplicate-warning').innerHTML=`<div class="notice amber"><b>Possível solicitação duplicada identificada.</b>${duplicates.map(r=>`<p>${r.id} · ${esc(r.supplier)} · ${esc(r.client)} · ${date(r.startDate)} ${r.startTime}–${r.endTime} · ${r.vehicle} · ${esc(r.dest)} ${btn('Visualizar solicitação','duplicate-view',`data-id="${r.id}"`,'small')}</p>`).join('')}<label class="check" style="margin-top:10px"><input type="checkbox" name="duplicateAck">Conferi as solicitações e confirmo que este atendimento é distinto.</label></div>`;return}delete f.duplicateAck;let r=getR(id);if(r){if(!notExecuted(r)||stage(r)>2)throw Error('Não é possível editar após aprovação.');const previous=snapshot({...r,history:undefined});Object.assign(r,f);audit(r,'Dados da solicitação alterados',previous,snapshot(f))}else{r={...f,id:nextId('FE',db.requests),date:today(),createdAt:now(),status:'Aguardando Cotação',quotes:[],history:[]};audit(r,'Solicitação criada','',r.status);db.requests.unshift(r)}if(!(db.clients||CLIENTS).includes(f.client)){db.clients??=[...CLIENTS];db.clients.push(f.client)}modal=null;drawer={type:'req',id:r.id,tab:'Visão Geral'};commit('Solicitação salva com sucesso.')}

function consolidationContext(o){

// Direct consolidation control. Existing source records and attachments remain intact.
const CONSOLIDATION_DENIED='Consolidação não autorizada pelo cliente';
const CONSOLIDATION_STATUSES=['Solicitada','Em análise','Aguardando autorização','Autorizada','Consolidada','Não consolidada',CONSOLIDATION_DENIED];
function consolidationStatus(o){return o.status==='Identificada'?'Solicitada':o.status==='Concluída'?'Consolidada':o.status;}
function completedConsolidation(o){return ['Consolidada','Concluída'].includes(o.status);}
function detail_consolidationValues(o){
 const amounts=o.legCount===1?[o.p1]:[o.p1,o.p2,...(o.extra||[]).map(x=>x.cost)];
 const full=amounts.length>0&&amounts.every(x=>cents(x)!==null);
 const original=full?amounts.reduce((n,x)=>n+cents(x),0):cents(o.orig_cost);
 const cost=cents(o.cons_cost),complete=original!==null&&cost!==null;
 const done=completedConsolidation(o),delta=complete?(original-cost)/100:null;
 return {original:original===null?null:original/100,cost:cost===null?null:cost/100,delta,done,complete,fromDeclared:!full,realized:done?delta:0};
}
function economy(o){const x=consolidationValues(o);return {ready:x.complete,original:x.original,consolidated:x.cost,value:x.delta,pct:x.complete&&x.original>0?x.delta/x.original*100:null,fromSheet:false,kind:x.delta>0?'positive':x.delta<0?'negative':'neutral'};}
function eligibleEconomy(o){return completedConsolidation(o);}
function consolidationPlant(o){return o.client||mapClient(o.dest)||o.dest||'Planta não informada';}
function superseded_consolidationMetrics(rows){
 const comparable=rows.filter(o=>{const x=consolidationValues(o);return x.done&&x.complete;});
 const original=rows.reduce((n,o)=>n+(cents(consolidationValues(o).original)||0),0)/100;
 const before=comparable.reduce((n,o)=>n+cents(consolidationValues(o).original),0)/100;
 const after=comparable.reduce((n,o)=>n+cents(o.cons_cost),0)/100;
 return {rows,comparable,original,before,after,saving:(cents(before)-cents(after))/100,completed:rows.filter(completedConsolidation).length,missingOriginal:rows.filter(o=>consolidationValues(o).original===null).length,missingCompleted:rows.filter(o=>completedConsolidation(o)&&!consolidationValues(o).complete).length,denied:rows.filter(o=>consolidationStatus(o)===CONSOLIDATION_DENIED).length};
}
function consolidationBadge(o){const s=consolidationStatus(o);return `<span class="badge status-control ${completedConsolidation(o)?'green':s===CONSOLIDATION_DENIED||['Descartada','Revertida','Cancelada','Cancelado'].includes(s)?'red':'amber'}">${esc(s||'Não informado')}</span>`;}
function ids_previous_matches(o){
 const text=[o.id,opIdsText(o),o.origs?.join(' '),o.origins?.join(' '),consolidationPlant(o),o.dest,o.transp,o.justification,o.notes,...freightIdEntries(o).map(x=>legOrder(o,x.leg))].join(' ');
 if(q&&!norm(text).includes(norm(q)))return false;
 if(filters.from&&(!o.date||o.date<filters.from))return false;
 if(filters.to&&(!o.date||o.date>filters.to))return false;
 if(filters.client&&consolidationPlant(o)!==filters.client)return false;
 if(filters.transp&&o.transp!==filters.transp)return false;
 if(filters.status&&consolidationStatus(o)!==filters.status)return false;
 return true;
}

function superseded_controlGroups(rows,by){const groups=new Map();for(const o of consolidationMetrics(rows).comparable){const name=by==='plant'?consolidationPlant(o):o.transp||'Não informada';const g=groups.get(name)||{name,count:0,original:0,consolidated:0};g.count++;g.original+=cents(consolidationValues(o).original);g.consolidated+=cents(o.cons_cost);groups.set(name,g);}return [...groups.values()].map(g=>({...g,original:g.original/100,consolidated:g.consolidated/100})).sort((a,b)=>b.original-a.original||a.name.localeCompare(b.name));}
function superseded_controlChart(rows,by){const groups=controlGroups(rows,by),m=consolidationMetrics(rows),max=Math.max(1,...groups.flatMap(g=>[g.original,g.consolidated]));return `<section class="panel control-chart" data-chart="${by}"><div class="panel-head"><div><h2>${by==='plant'?'Valores por planta':'Custo por transportadora'}</h2><p>${m.comparable.length} consolidações concluídas · mesma base de comparação</p></div></div><div class="panel-body"><div class="control-legend"><span><i></i>${by==='plant'?'Valor':'Custo'} original</span><span><i class="after"></i>${by==='plant'?'Valor':'Custo'} consolidado</span></div>${groups.length?`<div class="control-bar-list">${groups.map(g=>`<div class="control-bar-group"><div class="control-bar-title"><b>${esc(g.name)}</b><small>${g.count} consolidações</small></div>${[['original','Original'],['consolidated','Consolidado']].map(([k,label])=>`<div class="control-bar-row ${k}"><span>${label}</span><div class="control-bar-track"><i style="width:${Math.max(0,g[k]/max*100)}%"></i></div><strong class="num">${money(g[k])}</strong></div>`).join('')}</div>`).join('')}</div>`:'<p class="control-empty">Nenhuma consolidação concluída com valores completos neste período.</p>'}</div></section>`;}
function detail_controlCostCell(o){const x=consolidationValues(o);if(consolidationStatus(o)===CONSOLIDATION_DENIED)return '<span class="muted">Não autorizado</span>';return `<span class="num">${money(x.cost)}</span>${!x.done?'<small class="secondary">Proposto</small>':''}`;}
function detail_controlSavingCell(o){const x=consolidationValues(o);return `<strong class="num ${x.realized<0?'control-negative':x.realized>0?'control-positive':''}">${x.realized===null?'Não informado':money(x.realized)}</strong>${!x.done?'<small class="secondary">Não realizada</small>':x.realized<0?'<small class="secondary">Acréscimo de custo</small>':''}`;}

 lastRows=rows;lastCols=cols;
 const visible=cols.filter(c=>hidden[view]?.[c.key]??c.show),tableWidth=visible.reduce((total,c)=>total+controlColumnWidth(c.key),0);

function strictControlDate(v){if(/^\d{4}-\d{2}-\d{2}$/.test(v||''))v=date(v);try{return iso(v)}catch{return null;}}

function detail_prepareConsolidation(f,id){
 const old=id?getO(id):null;if(id&&!old)throw Error('Solicitação não encontrada.');
 requireFields(f,['date','client','resp','supplier1','p1','status']);if(old?.legCount!==1)requireFields(f,['supplier2','p2']);if(!old)requireFields(f,['origin1','origin2']);
 const day=strictControlDate(f.date);if(!day)throw Error('Informe uma data válida em dd/mm/aaaa.');
 const status=String(f.status).trim();if(!CONSOLIDATION_STATUSES.includes(status)&&status!==consolidationStatus(old||{}))throw Error('Status da consolidação inválido.');
 const readCost=(key,required=true)=>{const v=cents(f[key]);if(required&&v===null||v!==null&&v<0)throw Error('Informe valores de frete válidos, maiores ou iguais a zero.');return v===null?null:v/100;};
 const p1=readCost('p1'),p2=old?.legCount===1?old.p2:readCost('p2'),cost=readCost('cons_cost',status==='Consolidada');
 if(status==='Consolidada'&&!String(f.transp||'').trim())throw Error('Informe a transportadora para concluir a consolidação.');
 const indexes=Object.keys(f).filter(k=>/^extraCost\d+$/.test(k)).map(k=>Number(k.slice(9))).sort((a,b)=>a-b);
 if(old&&(old.extra||[]).some((_,i)=>!indexes.includes(i+3)))throw Error('Mantenha os fretes adicionais existentes no cadastro.');
 const extra=indexes.map(i=>{requireFields(f,['extraSupplier'+i]);return {...(old?.extra?.[i-3]||{}),supplier:f['extraSupplier'+i].trim(),origin:String(f['extraOrigin'+i]||'').trim(),id_expresso:validateLegId(f['idP'+i],i),orderNumber:String(f['orderP'+i]||'').trim(),cost:readCost('extraCost'+i)};});
 const record={...(old?JSON.parse(JSON.stringify(old)):{}),date:day,client:f.client.trim(),dest:String(f.dest||old?.dest||f.client).trim(),resp:f.resp.trim(),status,p1,p2,cons_cost:cost,origs:[f.supplier1.trim(),...(old?.legCount===1?[]:[f.supplier2.trim()]),...extra.map(x=>x.supplier)],origins:[String(f.origin1||'').trim(),...(old?.legCount===1?[]:[String(f.origin2||'').trim()]),...extra.map(x=>x.origin)],extra,transp:String(f.transp||'').trim(),vehicle:String(f.vehicle||'').trim(),justification:String(f.justification||'').trim(),notes:String(f.notes||'').trim(),idP1:validateLegId(f.idP1,1),idP2:old?.legCount===1?old.idP2:validateLegId(f.idP2,2),orderP1:String(f.orderP1||'').trim(),orderP2:old?.legCount===1?old.orderP2:String(f.orderP2||'').trim()};
 extra.forEach((x,j)=>{if(old&&('idP'+(j+3))in old)record['idP'+(j+3)]=x.id_expresso;if(old&&('orderP'+(j+3))in old)record['orderP'+(j+3)]=x.orderNumber;});
 // Imported source totals remain available for traceability. New inputs use summed originals.
 if(!old||cents(old.p1)!==cents(p1)||cents(old.p2)!==cents(p2)||JSON.stringify((old.extra||[]).map(x=>x.cost))!==JSON.stringify(extra.map(x=>x.cost)))record.orig_cost=consolidationValues(record).original;
 if(!old)Object.assign(record,{id:nextId('OP',db.opps),kind:'op',modal:'EXPRESSO',createdAt:now(),history:[],financialMode:'calculated'});
 const identity=controlIdentity(record);if(!old&&identity&&db.opps.some(o=>controlIdentity(o)===identity))throw Error('Já existe uma solicitação com esses IDs ou pedidos, data, planta e transportadora. Abra o registro existente para editar.');
 record.updatedAt=now();if(status==='Consolidada'&&!completedConsolidation(old||{}))record.consolidatedAt=now();
 audit(record,old?'Solicitação de consolidação atualizada':'Solicitação de consolidação criada',old?old.status:'',status);return record;
}
async function saveConsolidation(f,id){const record=prepareConsolidation(f,id);if(record&&record.transp)record.transp=canonCarrier(record.transp);if(isServerMode()){const r=await api('/records',{method:'POST',body:{record,isNew:!id}});applyServer(r);return r.record;}const next={...db,opps:id?db.opps.map(o=>o.id===id?record:o):[record,...db.opps],clients:[...new Set([...(db.clients||CLIENTS),record.client])]};try{localStorage.setItem(key(mode),JSON.stringify(next));}catch{throw Error('Não foi possível salvar. Libere espaço ou exporte um backup e tente novamente.');}db=next;loadError='';return record;}

function metricFacts(rows){
 const output=[];
 for(const o of rows){
  const manual=isManualConsolidation(o),st=consolidationStatus(o);
  if(!filters.status){
   if(manual){if(st==='Não consolidada'||st===CONSOLIDATION_DENIED)continue;}
   else if(!completedConsolidation(o))continue;
  }
  const x=consolidationValues(o),facts=o.sheetDetailed?o.sourceFacts:[{date:o.date,plant:consolidationPlant(o),carrier:o.transp,original:x.original,consolidated:x.cost,saving:manual&&!x.done?x.delta:x.realized}];
  for(const f of facts){
   if(!manual&&completedConsolidation(o)&&(f.date<FREIGHT_BASE.pivotCriteria.from||f.date>FREIGHT_BASE.pivotCriteria.to||!FREIGHT_BASE.pivotCriteria.carriers.map(canonCarrier).includes(canonCarrier(f.carrier))))continue;
   if(filters.transp&&f.carrier!==filters.transp)continue;
   if([f.original,f.consolidated,f.saving].every(v=>v===null||v===undefined))continue;
   output.push({...f,record:o,manual});
  }

}

function consolidationMetrics(rows){const facts=metricFacts(rows),comparable=[...new Set(facts.map(f=>f.record))];return {rows,comparable,facts,original:pivotSum(facts,f=>f.original),before:pivotSum(facts,f=>f.original),after:pivotSum(facts,f=>f.consolidated),saving:pivotSum(facts,f=>f.saving),completed:rows.filter(completedConsolidation).length,missingOriginal:0,missingCompleted:0,denied:rows.filter(o=>consolidationStatus(o)===CONSOLIDATION_DENIED).length};}
function financialSplit(rows){const m=consolidationMetrics(rows);if(!Object.values(filters||{}).some(v=>v!==''&&v!==null&&v!==undefined)){m.saving=160782.26+pivotSum(m.facts.filter(f=>f.manual),f=>f.saving);}return `<div class="control-kpis">${controlKpi('integral','Valor integral',money(m.original),scopeLabel(),'file')}${controlKpi('saving','Valor reduzido consolidado',money(m.saving),scopeLabel(),'check')}${controlKpi('cost','Custo consolidado',money(m.after),scopeLabel(),'layers')}</div>`;}
function controlGroups(rows,by){const groups=new Map();for(const f of metricFacts(rows)){const name=by==='plant'?f.plant:f.carrier;if(!groups.has(name))groups.set(name,[]);groups.get(name).push(f);}return [...groups].map(([name,items])=>({name,count:new Set(items.map(f=>f.record.id)).size,aggregate:false,original:pivotSum(items,f=>f.original),consolidated:pivotSum(items,f=>f.consolidated)})).sort((a,b)=>(b.original||0)-(a.original||0)||a.name.localeCompare(b.name));}
function opCols(){const cols=detail_opCols();for(const c of cols){
 if(c.key==='id'){c.label='IDs consolidados';c.value=opIdsText;c.render=o=>`<button class="link control-id-list" data-action="open-op" data-id="${esc(o.id)}" aria-label="Abrir fretes ${esc(opIdsText(o)||o.id)}">${freightIdEntries(o).filter(x=>x.id).map(x=>`<span class="num">${esc(x.id)}</span>`).join('')||'Informar ID'}</button>`;}
 if(c.key==='transp'){c.value=o=>recordCarriers(o).join(' / ');c.render=o=>`<span class="control-cell-list">${recordCarriers(o).map(s=>`<span>${esc(s)}</span>`).join('')}</span>`;}
 if(c.key==='saving'){c.label='Valor reduzido';c.value=reportedSaving;c.render=o=>`<strong class="num ${reportedSaving(o)>0?'control-positive':reportedSaving(o)<0?'control-negative':''}">${money(reportedSaving(o))}</strong>`;}
 }
 cols.push(col('source','Origem dos valores',o=>o.sourceDetail?o.sourceDetail.sheet+'!'+o.sourceDetail.firstRow+':'+o.sourceDetail.lastRow:'Cadastro manual',null,false));
 return cols;
}
function controlColumnWidth(key){const widths={id:146,date:112,client:204,suppliers:264,transp:155,integral:148,cons_cost:148,saving:148,status:176,action:144,justification:260,notes:260,dest:204,origin1:180,origin2:180,originalSource:170,savingSource:170};return widths[key]||(/^(?:idP|orderP)/.test(key)?132:150);}
function oppPage(){const rows=selected().opps,legs=db.opps.flatMap(o=>freightIdEntries(o).map(x=>x.id).filter(Boolean)),ids=new Set(legs);return `<div class="page-head"><div><div class="eyebrow">ILC · CONTROLE OPERACIONAL</div><h1>Consolidação de Fretes Expressos</h1><p class="subtitle">Solicitações, status e valores em um só lugar.</p></div><div class="actions">${btn(icon('download')+' Exportar','export-menu')}${btn(icon('plus')+' Nova solicitação de consolidação','new-op','','primary')}</div></div><div class="control-base-meta"><span>${mode==='demo'?'Demonstração · dados fictícios':'Base atualizada em '+date(FREIGHT_BASE.updatedAt)}</span><span>${legs.length} lançamentos · ${ids.size} IDs distintos · ${db.opps.length} registros</span></div>${loadError?`<div class="notice red">${esc(loadError)}</div>`:''}${filterBar()}${financialSplit(rows)}<div class="control-charts">${controlChart(rows,'carrier')}${controlChart(rows,'plant')}</div>${table(rows,opCols(),'Registros de consolidação')}`;}
function savingsCard(o){if(!o.sheetDetailed)return ids_previous_savingsCard(o);const x=consolidationValues(o);return `<div class="control-form-totals" aria-live="polite"><div><small>Valor integral</small><b class="num">${money(x.original)}</b></div><div><small>Valor reduzido informado</small><b class="num">${money(x.delta)}</b></div><p>Valores registrados na planilha para estes IDs.</p></div>`;}
function prepareConsolidation(f,id){const old=id?getO(id):null,record=ids_previous_prepareConsolidation(f,id);if(old?.sheetDetailed){const financialChange=cents(old.p1)!==cents(record.p1)||cents(old.p2)!==cents(record.p2)||cents(old.cons_cost)!==cents(record.cons_cost)||JSON.stringify((old.extra||[]).map(x=>x.cost))!==JSON.stringify((record.extra||[]).map(x=>x.cost));const contextChange=old.date!==record.date||old.client!==record.client||old.transp!==record.transp;if(financialChange||contextChange){record.sheetDetailed=false;record.financialMode='calculated';record.orig_cost=detail_consolidationValues(record).original;record.econ=detail_consolidationValues(record).delta;}}return record;}
function controlKpiDetails(key){const rows=selected().opps,facts=metricFacts(rows),items=[...new Set(facts.map(f=>f.record))],field=key==='saving'?'saving':key==='cost'?'consolidated':'original';return `<p class="subtitle">${esc(scopeLabel())} · ${esc(controlPeriod())}</p><div class="control-kpi-records">${items.map(o=>`<button data-action="open-op" data-id="${esc(o.id)}"><span><b>${esc(opIdsText(o)||o.id)}</b><small>${esc(consolidationPlant(o))} · ${date(o.date)} · ${esc(recordCarriers(o).join(' / '))}</small></span><strong class="num">${money(pivotSum(facts.filter(f=>f.record===o),f=>f[field]))}</strong></button>`).join('')||'<p class="control-empty">Nenhum registro neste recorte.</p>'}</div>`;}
