/* ===== Servidor (Netlify Functions): dados compartilhados entre computadores ===== */
let serverEtag=null,pendingLocalRecords=[],pollTimer=null,pushTimer=null;
const isServerMode=()=>mode==='base';
const MIGRATED_KEY='ilc_fretes_migrated_v1';
async function api(path,opts={}){
 const hasBody=opts.body!==undefined;
 let res;
 try{res=await fetch('/api'+path,{method:opts.method||'GET',headers:hasBody?{'content-type':'application/json'}:{},body:hasBody?JSON.stringify(opts.body):undefined,credentials:'same-origin',cache:'no-store'});}
 catch{throw Error('Sem conexão com o servidor. Verifique a internet e tente novamente.');}
 let data={};try{data=await res.json();}catch{}
 if(res.status===401&&path!=='/login'&&path!=='/me'&&authState.user){authState.user=null;stopPolling();authScreen('Sua sessão expirou. Entre novamente.');}
 if(!res.ok){const err=Error(data.error||('Erro '+res.status+' ao falar com o servidor.'));err.status=res.status;throw err;}
 return data;
}
function applyServer(r){if(!isServerMode()||!r||!r.db)return;db=normalizeStoreCarriers(r.db);serverEtag=r.etag||null;loadError='';refreshPendingLocal();}
// Registros cadastrados neste navegador antes da versão online e que ainda não estão no servidor
function refreshPendingLocal(){
 pendingLocalRecords=[];
 try{
  if(localStorage.getItem(MIGRATED_KEY)||!isServerMode())return;
  const raw=localStorage.getItem(key('base'));if(!raw)return;
  const local=JSON.parse(raw);if(!validStore(local))return;normalizeStoreCarriers(local);
  const deleted=new Set(db.deletedIds||[]),server=new Map(db.opps.map(o=>[o.id,JSON.stringify(o)]));
  pendingLocalRecords=local.opps.filter(o=>isManualConsolidation(o)&&!deleted.has(o.id)&&server.get(o.id)!==JSON.stringify(o));
 }catch{pendingLocalRecords=[];}
}
async function syncFromServer(){
 if(!isServerMode())return;
 let r=await api('/data');
 if(!r.db){ // primeira vez: o servidor começa com os dados deste navegador
  const seed=load();
  r=await api('/data',{method:'PUT',body:{db:seed,onlyIfEmpty:true}});
  if(r.created){try{localStorage.setItem(MIGRATED_KEY,new Date().toISOString());}catch{}}
 }
 if(r.db&&r.db.freightSourceRevision!==FREIGHT_BASE.revision){ // planilha nova no código: mantém os cadastros manuais
  const d=r.db,del=new Set(d.deletedIds||[]),keep=d.opps.filter(o=>!o.pivotAggregate&&!o.workbookSource&&!o.sheetDetailed),nb=fresh();
  nb.user=d.user||nb.user;nb.deletedIds=d.deletedIds||[];nb.opps=nb.opps.filter(o=>!del.has(o.id));nb.opps.push(...keep);
  r=await api('/data',{method:'PUT',body:{db:nb,etag:r.etag}});
 }
 applyServer(r);
}
function schedulePush(){clearTimeout(pushTimer);pushTimer=setTimeout(async()=>{try{applyServer(await api('/data',{method:'PUT',body:{db,etag:serverEtag}}));render();}catch(e){toast(e.message,true);try{await syncFromServer();render();}catch{}}},0);}
async function pollServer(){
 if(!isServerMode()||!authState.user||document.hidden||modal)return;
 const a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;
 try{const r=await api('/data');if(r.db&&r.etag!==serverEtag&&!modal){applyServer(r);render();}}catch{}
}
function startPolling(){stopPolling();pollTimer=setInterval(pollServer,45000);}
function stopPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=null;}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollServer();});
const _srvOppPage=oppPage;oppPage=function(){
 const n=pendingLocalRecords.length;
 const banner=n&&isServerMode()?`<div class="notice" style="margin:0 0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:240px">Este computador tem <b>${n}</b> registro(s) cadastrados antes da versão online que ainda não estão no servidor.</span>${btn('Enviar para o servidor','sync-upload-local','','small primary')}${btn('Ignorar','sync-dismiss-local','','small')}</div>`:'';
 return banner+_srvOppPage.apply(this,arguments);
};
document.addEventListener('click',async e=>{
 const el=e.target.closest?.('[data-action="sync-upload-local"],[data-action="sync-dismiss-local"]');if(!el)return;
 e.preventDefault();e.stopImmediatePropagation();
 try{
  if(el.dataset.action==='sync-upload-local'){
   const r=await api('/records/bulk',{method:'POST',body:{records:pendingLocalRecords}});
   try{localStorage.setItem(MIGRATED_KEY,new Date().toISOString());}catch{}
   applyServer(r);render();toast(r.added.length?`${r.added.length} registro(s) enviados ao servidor.`:'Esses registros já estavam no servidor.');
  }else{
   confirmBox('Ignorar registros locais',`<p>O aviso deixa de aparecer neste computador e esses ${pendingLocalRecords.length} registro(s) não serão enviados ao servidor.</p>`,async()=>{try{localStorage.setItem(MIGRATED_KEY,'ignorado');}catch{}pendingLocalRecords=[];modal=null;render();});
  }
 }catch(x){toast(x.message||String(x),true);}
},true);
/* ===== Login / Sair / Usuários ===== */
const AUTH_DEFAULT_USERS=[];
const AUTH_KEY='ilc_fretes_auth_v1',AUTH_USERS_KEY='ilc_fretes_users_v1',AUTH_TTL=12*60*60*1000;
const AUTH_ROLES={admin:'Administrador',operacao:'Operação'};
let authNotice=null;
let authState={user:null,users:[],usersLoaded:false,usersLoading:false};
// Lista antiga de usuários salva neste navegador (usada só para enviar ao servidor uma vez)
function authLocalUsers(){try{const v=JSON.parse(localStorage.getItem(AUTH_USERS_KEY)||'null');return Array.isArray(v)?v.filter(u=>u&&u.login&&u.name&&u.hash&&u.salt&&AUTH_ROLES[u.role]):[];}catch{return [];}}
function authUsers(){return authState.users.length?authState.users:(authState.user?[authState.user]:[]);}
function authSaveUsers(){}
function authRead(){return authState.user?{login:authState.user.login}:null;}
function authUser(){return authState.user;}
async function loadUsersList(){if(authState.usersLoading)return;authState.usersLoading=true;try{const r=await api('/users');authState.users=r.users;authState.usersLoaded=true;if(view==='settings'&&!modal)render();}catch(x){authState.usersLoaded=true;toast(x.message||String(x),true);}finally{authState.usersLoading=false;}}
async function authBoot(){
 document.getElementById('root').innerHTML='<div style="display:grid;place-items:center;min-height:100vh;font:600 15px system-ui,sans-serif;color:#0b2733">Carregando…</div>';
 try{const r=await api('/me');authState.user=r.user;}catch(e){return authScreen(e.status===401?'':e.message);}
 try{await syncFromServer();}catch(e){loadError='Não foi possível carregar os dados do servidor: '+e.message;}
 render();startPolling();
}
function authLogin(){return authUser()?.login||'';}
function authName(){return authUser()?.name||db.user;}
function authIsAdmin(){return authUser()?.role==='admin';}
async function authHash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function authSalt(){return [...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function authMake(login,pw){const salt=authSalt();return {salt,hash:await authHash(salt+':'+login+':'+pw)};}
async function authCheck(u,pw){return !!u&&(await authHash(u.salt+':'+u.login+':'+pw))===u.hash;}
function authValidPw(pw){if(!pw||pw.length<6)throw Error('A senha precisa ter pelo menos 6 caracteres.');}
function authScreen(msg=''){modal=null;drawer=null;document.body.className='';document.body.style.overflow='';document.getElementById('root').innerHTML=`<div class="auth-screen"><section class="auth-left"><svg class="auth-net" viewBox="0 0 600 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g stroke="#3fc8e2" stroke-opacity=".16" stroke-width="1.2" fill="none"><path d="M40 120 L150 210 L60 420 L180 560 L90 690"/><path d="M150 210 L330 60 L520 150 L600 300"/><path d="M60 420 L300 330 L520 150"/><path d="M180 560 L420 610 L560 470 L600 560"/><path d="M300 330 L560 470"/><path d="M330 60 L300 330"/></g><g fill="#2ccf9a" fill-opacity=".14"><circle cx="150" cy="210" r="22"/><circle cx="60" cy="420" r="18"/><circle cx="180" cy="560" r="20"/><circle cx="330" cy="60" r="14"/><circle cx="520" cy="150" r="24"/><circle cx="560" cy="470" r="18"/><circle cx="300" cy="330" r="10"/><circle cx="420" cy="610" r="13"/></g></svg><form class="auth-card" id="auth-form" autocomplete="on"><div class="auth-logo-badge"><img src="${AUTH_LOGO_LIGHTBG}" alt="ILC Integrator Logistics Company"></div><h1>Painel de Fretes Expressos</h1><label class="auth-field">E-mail<input type="email" name="login" autocomplete="username" placeholder="nome@ilclog.com.br" required autofocus></label><label class="auth-field">Senha<input type="password" name="password" autocomplete="current-password" required></label><label class="auth-keep"><input type="checkbox" name="keep"> Manter conectado neste computador</label><button type="submit">Entrar</button><div class="auth-error" role="alert">${esc(msg)}</div><div class="auth-tag">Controle de Consolidação<span>.</span></div><div class="auth-foot">ILC · Integradora 4PL</div></form></section><aside class="auth-right"><svg class="auth-diagram" viewBox="0 0 760 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ILC Integradora 4PL conectando fornecedores, plantas e CDs, transportadores e cliente final"><defs><radialGradient id="adg" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#145a6e"/><stop offset="1" stop-color="#0b2733"/></radialGradient></defs><path id="ap0" class="ad-line" d="M300 120 C350 122 330 230 278 273"/><path id="ap1" class="ad-line" d="M460 120 C410 122 430 230 482 273"/><path id="ap2" class="ad-line" d="M300 500 C350 498 330 390 278 347"/><path id="ap3" class="ad-line" d="M460 500 C410 498 430 390 482 347"/><g class="ad-box"><rect x="40" y="70" width="260" height="100" rx="16"/><text x="170" y="114" class="ad-t">Fornecedores</text><text x="170" y="142" class="ad-s">Pedido e forecast</text></g><g class="ad-box"><rect x="460" y="70" width="260" height="100" rx="16"/><text x="590" y="114" class="ad-t">Plantas e CDs</text><text x="590" y="142" class="ad-s">Inbound e outbound</text></g><g class="ad-box"><rect x="40" y="450" width="260" height="100" rx="16"/><text x="170" y="494" class="ad-t">Transportadores</text><text x="170" y="522" class="ad-s">Frete e rastreio</text></g><g class="ad-box"><rect x="460" y="450" width="260" height="100" rx="16"/><text x="590" y="494" class="ad-t">Cliente final</text><text x="590" y="522" class="ad-s">Entrega e comprovante</text></g><circle cx="380" cy="310" r="138" class="ad-halo"/><circle cx="380" cy="310" r="108" class="ad-core"/><image href="${LOGO}" x="302" y="252" width="156" height="64"/><text x="380" y="350" class="ad-cs">INTEGRADORA 4PL</text><g class="ad-chip"><rect x="-21" y="-21" width="42" height="42" rx="11"/><g class="ad-ic"><path d="M-7 3l1.6-5h10.8L7 3"/><path d="M-4-2v-4h8v4"/><path d="M0-6v-3"/><path d="M-9 6c2 1.4 3 1.4 4.5 0 1.5 1.4 3 1.4 4.5 0 1.5 1.4 3 1.4 4.5 0 1.5 1.4 2.5 1.4 4.5 0"/></g><animateMotion dur="7s" begin="0s" repeatCount="indefinite" keyPoints="0.04;0.96;0.04" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"><mpath href="#ap0"/></animateMotion></g><g class="ad-chip"><rect x="-21" y="-21" width="42" height="42" rx="11"/><g class="ad-ic"><rect x="-6" y="-8" width="12" height="13" rx="3"/><path d="M-6-1h12"/><circle cx="-3" cy="2" r=".6"/><circle cx="3" cy="2" r=".6"/><path d="M-4 5l-2 4M4 5l2 4"/></g><animateMotion dur="8s" begin="1.6s" repeatCount="indefinite" keyPoints="0.04;0.96;0.04" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"><mpath href="#ap1"/></animateMotion></g><g class="ad-chip"><rect x="-21" y="-21" width="42" height="42" rx="11"/><g class="ad-ic"><path d="M-9-5h10v9h-10z"/><path d="M1-2h4l3 3v3H1z"/><circle cx="-5" cy="6" r="1.8"/><circle cx="5" cy="6" r="1.8"/></g><animateMotion dur="6.5s" begin="0.8s" repeatCount="indefinite" keyPoints="0.04;0.96;0.04" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"><mpath href="#ap2"/></animateMotion></g><g class="ad-chip"><rect x="-21" y="-21" width="42" height="42" rx="11"/><g class="ad-ic"><path d="M-8 3l14-11c1.4-1.1 3.1.6 2 2L-3 8l-1 4-2-4-4-2z"/></g><animateMotion dur="7.5s" begin="2.4s" repeatCount="indefinite" keyPoints="0.04;0.96;0.04" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"><mpath href="#ap3"/></animateMotion></g></svg><div class="auth-badge"><small>ILC · Integradora 4PL</small><b>Fretes expressos sob controle, do pedido à entrega.</b></div></aside></div>`;setTimeout(()=>document.querySelector('#auth-form input[name=login]')?.focus(),0);}
function authUsersSection(){
 const me=authUser();if(!me)return '';
 const n=authNotice;authNotice=null;
 const note=n?`<div class="notice ${n.err?'red':''} auth-note">${esc(n.msg)}</div>`:'';
 const own=`<section class="panel"><div class="panel-head"><h2>Minha conta</h2></div><div class="panel-body"><p class="subtitle" style="margin-bottom:14px">${esc(me.name)} · ${esc(me.login)} · <b>${AUTH_ROLES[me.role]||me.role}</b></p><form id="auth-pw-form" autocomplete="off"><div class="form-grid"><label class="field"><span>Senha atual *</span><input type="password" name="current" autocomplete="current-password" required></label><label class="field"><span>Nova senha *</span><input type="password" name="next" autocomplete="new-password" minlength="6" required></label><label class="field"><span>Confirmar nova senha *</span><input type="password" name="confirm" autocomplete="new-password" minlength="6" required></label></div><div class="actions" style="margin-top:16px"><button type="submit" class="btn primary">Alterar senha</button></div></form></div></section>`;
 if(!authIsAdmin())return `<div class="auth-settings">${note}${own}</div>`;
 if(!authState.usersLoaded&&!authState.usersLoading)loadUsersList();
 const list=authUsers().slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
 const rows=list.map(u=>`<tr><td><b>${esc(u.name)}</b>${u.login===me.login?' <small class="auth-you">você</small>':''}</td><td>${esc(u.login)}</td><td>${u.login===me.login?`<span class="auth-role ${u.role}">${AUTH_ROLES[u.role]}</span>`:`<select data-auth-role="${esc(u.login)}" aria-label="Permissão de ${esc(u.name)}">${Object.entries(AUTH_ROLES).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select>`}</td><td class="auth-row-actions"><button type="button" class="btn ghost" data-auth="reset" data-login="${esc(u.login)}">Redefinir senha</button>${u.login===me.login?'':`<button type="button" class="btn ghost auth-danger" data-auth="remove" data-login="${esc(u.login)}">Remover</button>`}</td></tr>`).join('');
 const admin=`<section class="panel auth-users-panel"><div class="panel-head"><h2>Usuários e permissões</h2></div><div class="panel-body"><div class="auth-table-wrap"><table class="auth-table"><thead><tr><th>Nome</th><th>E-mail</th><th>Permissão</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><h3 class="auth-h3">Cadastrar novo usuário</h3><form id="auth-new-form" autocomplete="off"><div class="form-grid auth-new-grid"><label class="field"><span>Nome *</span><input name="name" required></label><label class="field"><span>E-mail *</span><input type="email" name="login" required></label><label class="field"><span>Permissão *</span><select name="role">${Object.entries(AUTH_ROLES).map(([k,v])=>`<option value="${k}" ${k==='operacao'?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Senha inicial *</span><input type="text" name="password" minlength="6" required></label></div><div class="actions" style="margin-top:16px"><button type="submit" class="btn primary">Cadastrar usuário</button>${authLocalUsers().length?'<button type="button" class="btn ghost" data-auth="import-local-users">Enviar usuários deste navegador</button>':''}<button type="button" class="btn ghost" data-auth="import-users">Importar arquivo de usuários</button></div></form><p class="subtitle" style="margin-top:14px"><b>Administrador:</b> cadastra usuários, define permissões e redefine senhas. <b>Operação:</b> usa o painel e altera a própria senha. Usuários e senhas ficam guardados no servidor e funcionam em qualquer computador.</p></div></section>`;
 return `<div class="auth-settings">${note}${own}${admin}</div>`;
}
function authOk(msg){authNotice={msg};render();}
function authFail(msg){authNotice={msg,err:true};render();}
document.addEventListener('submit',async e=>{const f=e.target;if(!['auth-form','auth-pw-form','auth-new-form'].includes(f.id))return;e.preventDefault();e.stopImmediatePropagation();
 if(f.id==='auth-form'){const btn=f.querySelector('button[type=submit]'),err=f.querySelector('.auth-error');const login=f.login.value.trim().toLowerCase(),pw=f.password.value;btn.disabled=true;err.textContent='';try{const r=await api('/login',{method:'POST',body:{login,password:pw,keep:f.keep.checked}});authState={user:r.user,users:[],usersLoaded:false,usersLoading:false};for(const s of [sessionStorage,localStorage]){try{s.removeItem(AUTH_KEY)}catch{}}try{await syncFromServer();}catch(x){loadError='Não foi possível carregar os dados do servidor: '+x.message;}render();startPolling();}catch(x){err.textContent=x.message||String(x);f.password.value='';f.password.focus();}finally{btn.disabled=false;}return;}
 try{
  const me=authUser();if(!me)return authScreen();
  if(f.id==='auth-pw-form'){const nx=f.next.value;authValidPw(nx);if(nx!==f.confirm.value)throw Error('A confirmação não confere com a nova senha.');await api('/password',{method:'POST',body:{current:f.current.value,next:nx}});return authOk('Senha alterada com sucesso.');}
  if(f.id==='auth-new-form'){if(!authIsAdmin())throw Error('Apenas administradores podem cadastrar usuários.');const name=f.name.value.trim(),login=f.login.value.trim().toLowerCase(),role=f.role.value,pw=f.password.value;if(!name)throw Error('Informe o nome.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(login))throw Error('Informe um e-mail válido.');authValidPw(pw);const r=await api('/users',{method:'POST',body:{name,login,role,password:pw}});authState.users=r.users;return authOk(`Usuário ${name} cadastrado como ${AUTH_ROLES[role]}.`);}
 }catch(x){authFail(x.message||String(x));}
},true);
document.addEventListener('change',async e=>{const s=e.target.closest?.('[data-auth-role]');if(!s)return;e.stopImmediatePropagation();if(!authIsAdmin())return;const u=authUsers().find(x=>x.login===s.dataset.authRole);if(!u)return;try{const r=await api('/users/'+encodeURIComponent(u.login),{method:'PATCH',body:{role:s.value}});authState.users=r.users;authOk(`Permissão de ${u.name} alterada para ${AUTH_ROLES[s.value]}.`);}catch(x){authFail(x.message||String(x));}},true);
function authCloseMenu(){const m=document.querySelector('.auth-menu'),t=document.querySelector('.auth-trigger');if(m)m.hidden=true;if(t)t.setAttribute('aria-expanded','false');}
async function authImportUsers(users){const r=await api('/users/import',{method:'POST',body:{users}});authState.users=r.users;return r;}
document.addEventListener('click',async e=>{const a=e.target.closest?.('[data-auth]');if(!a){if(!e.target.closest?.('.auth-menu'))authCloseMenu();return;}e.preventDefault();e.stopImmediatePropagation();const act=a.dataset.auth;
 try{
 if(act==='toggle'){const m=document.querySelector('.auth-menu');const open=m.hidden;m.hidden=!open;a.setAttribute('aria-expanded',String(open));if(open)m.querySelector('button')?.focus();}
 else if(act==='logout'){stopPolling();try{await api('/logout',{method:'POST',body:{}});}catch{}for(const s of [sessionStorage,localStorage]){try{s.removeItem(AUTH_KEY)}catch{}}authState={user:null,users:[],usersLoaded:false,usersLoading:false};authScreen();}
 else if(act==='settings'){authCloseMenu();view='settings';drawer=null;modal=null;render();}
 else if(!authIsAdmin()){return;}
 else if(act==='reset'){const u=authUsers().find(x=>x.login===a.dataset.login);if(!u)return;const pw=prompt(`Nova senha para ${u.name} (mínimo 6 caracteres):`);if(pw===null)return;authValidPw(pw);const r=await api('/users/'+encodeURIComponent(u.login),{method:'PATCH',body:{password:pw}});authState.users=r.users;authOk(`Senha de ${u.name} redefinida.`);}
 else if(act==='remove'){const u=authUsers().find(x=>x.login===a.dataset.login);if(!u||u.login===authLogin())return;if(!confirm(`Remover o acesso de ${u.name} (${u.login})?`))return;const r=await api('/users/'+encodeURIComponent(u.login),{method:'DELETE',body:{}});authState.users=r.users;authOk(`Acesso de ${u.name} removido.`);}
 else if(act==='import-local-users'){const local=authLocalUsers();if(!local.length)return;if(!confirm(`Enviar ${local.length} usuário(s) salvos neste navegador para o servidor?\n\nQuem já existe no servidor não é alterado. Cada pessoa continua entrando com a senha que já usava.`))return;const r=await authImportUsers(local);try{localStorage.removeItem(AUTH_USERS_KEY);}catch{}authOk(r.added.length?`${r.added.length} usuário(s) enviados ao servidor: ${r.added.map(u=>u.name).join(', ')}.`:'Todos esses usuários já estavam no servidor.');}
 else if(act==='import-users'){const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';inp.onchange=async()=>{try{const d=JSON.parse(await inp.files[0].text());const users=d?.users;if(d?.type!=='ilc-fretes-usuarios'||!Array.isArray(users)||!users.length)throw Error('Arquivo de usuários inválido.');if(!confirm(`Enviar ${users.length} usuário(s) do arquivo para o servidor? Quem já existe não é alterado.`))return;const r=await authImportUsers(users);authOk(r.added.length?`${r.added.length} usuário(s) adicionados: ${r.added.map(u=>u.name).join(', ')}.`:'Todos os usuários do arquivo já estavam no servidor.');}catch(x){authFail(x.message||String(x));}};inp.click();}
 }catch(x){authFail(x.message||String(x));}
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.auth-menu:not([hidden])')){authCloseMenu();document.querySelector('.auth-trigger')?.focus();e.stopImmediatePropagation();}if(!authRead()&&document.querySelector('.auth-screen'))e.stopImmediatePropagation();},true);
const _authSettings=settingsPage;settingsPage=function(){return _authSettings.apply(this,arguments)+authUsersSection();};
const _authRender=render;render=function(){if(!authRead())return authScreen();return _authRender.apply(this,arguments);};
authBoot();
</script></body></html>
